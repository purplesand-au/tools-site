<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal | Purple Sand</title>
    <style>
        :root {
            --primary: #4A154B; /* A clean, modern purple to match your branding */
            --bg: #fdfbfd;
            --text: #333333;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(74, 21, 75, 0.08);
            border: 1px solid rgba(74, 21, 75, 0.05);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        p {
            color: #666666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .footer {
            font-size: 12px;
            color: #999999;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">purplesand</div>
        <h1>Secure Client Portal</h1>
        <p>Welcome to our workspace utilities. If you are a client looking for your project tools, dashboard, or assets, please use the direct secure URL provided to you by your account manager.</p>
        
        <div class="footer">
            &copy; 2026 purplesand.com.au. All rights reserved.
        </div>
    </div>

</body>
</html>
